[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-face-recognition-system"
version = "0.1.0"
description = "Enterprise-grade secure face recognition system with cancelable biometrics, multi-factor liveness, and tamper-evident audit logging"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Project Team" }
]
dependencies = []

[project.scripts]
sfrs = "main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "evaluation*", "liveness*", "security*", "ui*", "web*"]
exclude = ["tests*", "data*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

